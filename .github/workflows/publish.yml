name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Exchange GitHub OIDC token for npm token
        id: npm-token
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          PKG=$(node -p "encodeURIComponent('@juanbenjumea/pi-agy')")
          RESPONSE=$(curl -sS -X POST -H "Authorization: Bearer $ID_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG")
          echo "$RESPONSE" | jq -e '.token' >/dev/null || { echo "Token exchange failed: $RESPONSE"; exit 1; }
          NPM_TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          echo "::add-mask::$NPM_TOKEN"
          echo "token=$NPM_TOKEN" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-token.outputs.token }}
